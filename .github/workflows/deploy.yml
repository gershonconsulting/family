# attia.net - deploy public/ to Hostinger over FTP.
#
# Runs on manual dispatch only until the four FTP secrets exist, so an
# unprovisioned repository does not produce a failing check on every push.
# Once FTP_HOST / FTP_USER / FTP_PASSWORD / FTP_REMOTE_DIR are set in
# Settings -> Secrets and variables -> Actions, uncomment the push trigger.
name: Deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: find public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Require deploy secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ]; then
            echo "::error::FTP secrets are not configured. See docs/RUNBOOK_attia-net.md section 4."
            exit 1
          fi

      - name: Upload public/ over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false

      - name: Note where to verify
        run: echo "Deploy finished. Check https://attia.net/health once the domain resolves."
